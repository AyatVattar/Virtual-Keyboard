
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Virtual Keyboard</title>

   
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <main class="keyboard-container">

       
        <textarea
            id="input-field"
            placeholder="Start typing..."
        ></textarea>

      
        <div class="keyboard">

           
            <div class="row function-row">
                <button class="key image-key esc" data-action="escape"></button>

                <button class="key">F1</button>
                <button class="key">F2</button>
                <button class="key">F3</button>
                <button class="key">F4</button>
                <button class="key">F5</button>
                <button class="key">F6</button>
                <button class="key">F7</button>
                <button class="key">F8</button>
                <button class="key">F9</button>
                <button class="key">F10</button>
                <button class="key">F11</button>
                <button class="key">F12</button>

                <button class="key">PrtSc</button>
                <button class="key">Insert</button>
                <button class="key">Delete</button>
            </div>

            
            <div class="row number-row">

                <button class="key" data-value="`" data-shift="~">`</button>
                <button class="key" data-value="1" data-shift="!">1</button>
                <button class="key" data-value="2" data-shift="@">2</button>
                <button class="key" data-value="3" data-shift="#">3</button>
                <button class="key" data-value="4" data-shift="$">4</button>
                <button class="key" data-value="5" data-shift="%">5</button>
                <button class="key" data-value="6" data-shift="^">6</button>
                <button class="key" data-value="7" data-shift="&">7</button>
                <button class="key" data-value="8" data-shift="*">8</button>
                <button class="key" data-value="9" data-shift="(">9</button>
                <button class="key" data-value="0" data-shift=")">0</button>
                <button class="key" data-value="-" data-shift="_">-</button>
                <button class="key" data-value="=" data-shift="+">=</button>

                <button class="key image-key backspace"
                    data-action="backspace"></button>

            </div>

          
            <div class="row">

                <button class="key image-key tab"
                    data-value="\t"></button>

                <button class="key" data-letter="q">Q</button>
                <button class="key" data-letter="w">W</button>
                <button class="key" data-letter="e">E</button>
                <button class="key" data-letter="r">R</button>
                <button class="key" data-letter="t">T</button>
                <button class="key" data-letter="y">Y</button>
                <button class="key" data-letter="u">U</button>
                <button class="key" data-letter="i">I</button>
                <button class="key" data-letter="o">O</button>
                <button class="key" data-letter="p">P</button>

                <button class="key" data-value="[" data-shift="{">[</button>
                <button class="key" data-value="]" data-shift="}">]</button>
                <button class="key" data-value="\" data-shift="|">\</button>

            </div>

            
            <div class="row">

                <button class="key image-key caps"
                    data-action="caps"></button>

                <button class="key" data-letter="a">A</button>
                <button class="key" data-letter="s">S</button>
                <button class="key" data-letter="d">D</button>
                <button class="key" data-letter="f">F</button>
                <button class="key" data-letter="g">G</button>
                <button class="key" data-letter="h">H</button>
                <button class="key" data-letter="j">J</button>
                <button class="key" data-letter="k">K</button>
                <button class="key" data-letter="l">L</button>

                <button class="key" data-value=";" data-shift=":">;</button>
                <button class="key" data-value="'" data-shift="&quot;">'</button>

                <button class="key image-key enter" data-action="enter"></button>

            </div>

            <div class="row">

                <button class="key image-key shift2"
                    data-action="shift"></button>

                <button class="key" data-letter="z">Z</button>
                <button class="key" data-letter="x">X</button>
                <button class="key" data-letter="c">C</button>
                <button class="key" data-letter="v">V</button>
                <button class="key" data-letter="b">B</button>
                <button class="key" data-letter="n">N</button>
                <button class="key" data-letter="m">M</button>

                <button class="key" data-value="," data-shift="&lt;">,</button>
                <button class="key" data-value="." data-shift="&gt;">.</button>
                <button class="key" data-value="/" data-shift="?">/</button>

                <button class="key image-key shift"
                    data-action="shift"></button>

            </div>

            <div class="row bottom-row">

                <button class="key image-key ctrl"
                    data-action="modifier"></button>

                <button class="key fn image-key" data-action="modifier"></button>

                <button class="key">Win</button>

                <button class="key alt image-key" data-action="modifier"></button>

                <button class="key image-key space"
                    data-value=" "></button>

                <button class="key alt image-key" data-action="modifier"></button>

                <button class="key image-key ctrl"
                    data-action="modifier"></button>

                <div class="arrow-keys">
                    <button class="key">↑</button>
                    <div class="arrow-bottom">
                        <button class="key">←</button>
                        <button class="key">↓</button>
                        <button class="key">→</button>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
